<svg xmlns="http://www.w3.org/2000/svg" width="520" height="70" viewBox="0 0 520 70" xml:space="preserve" role="img" aria-label="Insert coin to continue: keee.vin">
  <title>Insert coin</title>
  <defs>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-weight: 700; }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <text class="blink" x="260" y="30" text-anchor="middle" font-size="22" letter-spacing="6" fill="#ffb000" filter="url(#glow)">INSERT COIN TO CONTINUE</text>
  <text x="260" y="58" text-anchor="middle" font-size="14" letter-spacing="4" fill="#39ff6a" filter="url(#glow)">▶ KEEE.VIN ◀</text>
</svg>
