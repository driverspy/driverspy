<svg xmlns="http://www.w3.org/2000/svg" width="520" height="170" viewBox="0 0 520 170" xml:space="preserve" role="img" aria-label="Current quest: AutoRole, a Discord bot at autorole.gg">
  <title>AutoRole</title>
  <defs>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".35"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-weight: 700; }
    .hi { fill: #39ff6a; }
    .lo { fill: #1f9e43; }
    .amb { fill: #ffb000; }
    .blink { animation: blink 1.2s steps(1, end) infinite; }
    .arrow { animation: nudge 1.2s ease-in-out infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: .15; } }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  </style>

  <rect width="520" height="170" rx="10" fill="#050a05"/>
  <!-- double pixel border -->
  <rect x="6" y="6" width="508" height="158" rx="6" fill="none" stroke="#39ff6a" stroke-width="2" filter="url(#glow)"/>
  <rect x="12" y="12" width="496" height="146" rx="3" fill="none" stroke="#145c29" stroke-width="2"/>

  <!-- tab label -->
  <rect x="28" y="0" width="182" height="22" fill="#050a05"/>
  <text x="119" y="17" text-anchor="middle" font-size="13" letter-spacing="3" class="amb" filter="url(#glow)">[ CURRENT QUEST ]</text>

  <text x="40" y="70" font-size="40" letter-spacing="6" class="hi" filter="url(#bigglow)">AUTOROLE</text>

  <g font-size="14" letter-spacing="1" filter="url(#glow)">
    <text x="40" y="104"><tspan class="lo">CLASS ..... </tspan><tspan class="hi">DISCORD BOT</tspan></text>
    <text x="40" y="130"><tspan class="lo">STATUS .... </tspan><tspan class="hi blink">●</tspan><tspan class="hi"> ONLINE</tspan></text>
  </g>

  <g class="arrow" filter="url(#glow)">
    <text x="478" y="130" text-anchor="end" font-size="16" class="amb">▶ autorole.gg</text>
  </g>

  <rect width="520" height="170" rx="10" fill="url(#scan)"/>
</svg>
